[uwsgi]
chdir = /site
socket = :8000
module = dmoj.wsgi:application
env = DJANGO_SETTINGS_MODULE=dmoj.settings
master = true
workers = 4
threads = 2
enable-threads = true
single-interpreter = true
need-app = true
vacuum = true
die-on-term = true
harakiri = 600
max-requests = 5000
reload-on-rss = 512
buffer-size = 65535
