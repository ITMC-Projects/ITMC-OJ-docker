# Windows dev: keep MariaDB data inside Docker's Linux filesystem.
services:
  db:
    healthcheck:
      # mysql.env sets MYSQL_HOST=db for Django. The healthcheck account
      # only allows local connections, so override it for this process.
      test: [CMD, env, MYSQL_HOST=localhost, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - dev_database:/var/lib/mysql/
  site:
    env_file: [../.env]
    environment:
      DEBUG: '${DEBUG:-1}'
    entrypoint: [uwsgi, --ini, uwsgi.ini, --py-autoreload, '1', --workers, '2']
  celery:
    env_file: [../.env]
    environment:
      DEBUG: '${DEBUG:-1}'
  bridged:
    env_file: [../.env]
    environment:
      DEBUG: '${DEBUG:-1}'
  beat:
    env_file: [../.env]
    environment:
      DEBUG: '${DEBUG:-1}'
  wsevent:
    env_file: [../.env]
volumes:
  dev_database:
